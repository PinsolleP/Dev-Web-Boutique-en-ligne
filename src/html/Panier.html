<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="../js/boutique.js"></script>
</head>

<body>
    <div class="jumbotron text-center">
        <h1>Pli</h1>
        <p>La boutique</p> 
    </div>
    <div class="container">
      <h3 class="shopping_cart">Votre panier</h3>
      <p id="id_description_panier">1 article . 1 produit</p>
      <hr class="solid">
      <div id="id_box">
        <div>
            <img src="../../img/img_test.jpg" alt="Test" width="200" height="200">
        </div>
        <div>
            <h2>Carnet Les petits jours</h2>
            <p><span id="id_price">14,00 € / article</span></p>
            <br/>
            <div class="div_increment_btn">
                <div class="wrapper">
                <span class="minus">-</span>
                <span class="num">01</span>
                <span class="plus">+</span>
            </div>
                <a href="#"><span id="delete_btn">Supprimer</span></a>
        </div>
        <div id="id-total-delivery-order">
            <p id="total-price-articles">Total</p>
            <p>Frais de livraison calculés à l'étape suivante</p>
            <br/>
            <br/>
            <a href="#"><span>&#8592;</span>Continuer mes achats</a>
        </div>
           
      </div>
       <hr class="solid">
      <div id="id_box">
        <div id="total-price-article">
            <span>14,00 €</span>
        </div>
        <div id="id-total-price-order-btn">
            <p id="id-total-value">14,00 €</p>
            <br/>
            <br/>
            <button type="button" class="btn btn-primary">Passer commande</button>
        </div>
      </div>
  </div>
</div>
</body>

</html>
