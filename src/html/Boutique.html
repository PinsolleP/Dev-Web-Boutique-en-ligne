
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pli - Notre boutique</title>

    <!-- Bootstrap 3.4.1 -->
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">

    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main id="boutique">

        <header class="boutique-entete">
            <p class="surtitre">PAPETERIE CRÉATIVE</p>

            <h1>La boutique</h1>

            <p>
                Trouvez les petits trésors qui donneront vie à vos idées.
            </p>
        </header>

        <section class="categories" aria-label="Catégories de produits">

            <h2>Explorer nos créations</h2>

            <div class="categories-liste">

                <button type="button" class="categorie active" data-categorie="tous">
                    Tout voir
                </button>

                <button type="button" class="categorie" data-categorie="carnets">
                    Carnets
                </button>

                <button type="button" class="categorie" data-categorie="accessoires">
                    Accessoires créatifs
                </button>

                <button type="button" class="categorie" data-categorie="stickers">
                    Stickers
                </button>

                <button type="button" class="categorie" data-categorie="kits">
                    Kits
                </button>

            </div>

        </section>

    </main>

</body>
</html>
